<svg xmlns="http://www.w3.org/2000/svg" viewBox="-200 -200 400 400">
  <!-- Traditional rangoli / kolam — 8-fold symmetry, lotus + dot motifs -->
  <g fill="none" stroke="#f5f0e8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Center dot -->
    <circle r="3" fill="#f5f0e8" stroke="none"/>

    <!-- Inner ring -->
    <circle r="14"/>

    <!-- 8 inner petals -->
    <g>
      <ellipse cx="0" cy="-32" rx="7" ry="16"/>
      <ellipse cx="0" cy="-32" rx="7" ry="16" transform="rotate(45)"/>
      <ellipse cx="0" cy="-32" rx="7" ry="16" transform="rotate(90)"/>
      <ellipse cx="0" cy="-32" rx="7" ry="16" transform="rotate(135)"/>
      <ellipse cx="0" cy="-32" rx="7" ry="16" transform="rotate(180)"/>
      <ellipse cx="0" cy="-32" rx="7" ry="16" transform="rotate(225)"/>
      <ellipse cx="0" cy="-32" rx="7" ry="16" transform="rotate(270)"/>
      <ellipse cx="0" cy="-32" rx="7" ry="16" transform="rotate(315)"/>
    </g>

    <!-- 8 small dots between inner petals -->
    <g fill="#f5f0e8" stroke="none">
      <circle cx="0" cy="-58" r="2.5" transform="rotate(22.5)"/>
      <circle cx="0" cy="-58" r="2.5" transform="rotate(67.5)"/>
      <circle cx="0" cy="-58" r="2.5" transform="rotate(112.5)"/>
      <circle cx="0" cy="-58" r="2.5" transform="rotate(157.5)"/>
      <circle cx="0" cy="-58" r="2.5" transform="rotate(202.5)"/>
      <circle cx="0" cy="-58" r="2.5" transform="rotate(247.5)"/>
      <circle cx="0" cy="-58" r="2.5" transform="rotate(292.5)"/>
      <circle cx="0" cy="-58" r="2.5" transform="rotate(337.5)"/>
    </g>

    <!-- Mid ring -->
    <circle r="72"/>

    <!-- 16 outer petals (slimmer, longer) -->
    <g>
      <path d="M 0 -82 Q -8 -110 0 -135 Q 8 -110 0 -82 Z"/>
      <path d="M 0 -82 Q -8 -110 0 -135 Q 8 -110 0 -82 Z" transform="rotate(22.5)"/>
      <path d="M 0 -82 Q -8 -110 0 -135 Q 8 -110 0 -82 Z" transform="rotate(45)"/>
      <path d="M 0 -82 Q -8 -110 0 -135 Q 8 -110 0 -82 Z" transform="rotate(67.5)"/>
      <path d="M 0 -82 Q -8 -110 0 -135 Q 8 -110 0 -82 Z" transform="rotate(90)"/>
      <path d="M 0 -82 Q -8 -110 0 -135 Q 8 -110 0 -82 Z" transform="rotate(112.5)"/>
      <path d="M 0 -82 Q -8 -110 0 -135 Q 8 -110 0 -82 Z" transform="rotate(135)"/>
      <path d="M 0 -82 Q -8 -110 0 -135 Q 8 -110 0 -82 Z" transform="rotate(157.5)"/>
      <path d="M 0 -82 Q -8 -110 0 -135 Q 8 -110 0 -82 Z" transform="rotate(180)"/>
      <path d="M 0 -82 Q -8 -110 0 -135 Q 8 -110 0 -82 Z" transform="rotate(202.5)"/>
      <path d="M 0 -82 Q -8 -110 0 -135 Q 8 -110 0 -82 Z" transform="rotate(225)"/>
      <path d="M 0 -82 Q -8 -110 0 -135 Q 8 -110 0 -82 Z" transform="rotate(247.5)"/>
      <path d="M 0 -82 Q -8 -110 0 -135 Q 8 -110 0 -82 Z" transform="rotate(270)"/>
      <path d="M 0 -82 Q -8 -110 0 -135 Q 8 -110 0 -82 Z" transform="rotate(292.5)"/>
      <path d="M 0 -82 Q -8 -110 0 -135 Q 8 -110 0 -82 Z" transform="rotate(315)"/>
      <path d="M 0 -82 Q -8 -110 0 -135 Q 8 -110 0 -82 Z" transform="rotate(337.5)"/>
    </g>

    <!-- Outer ring -->
    <circle r="148"/>

    <!-- 24 outer dots (every 15°) -->
    <g fill="#f5f0e8" stroke="none">
      <circle cx="0" cy="-162" r="2.8"/>
      <circle cx="0" cy="-162" r="2.8" transform="rotate(15)"/>
      <circle cx="0" cy="-162" r="2.8" transform="rotate(30)"/>
      <circle cx="0" cy="-162" r="2.8" transform="rotate(45)"/>
      <circle cx="0" cy="-162" r="2.8" transform="rotate(60)"/>
      <circle cx="0" cy="-162" r="2.8" transform="rotate(75)"/>
      <circle cx="0" cy="-162" r="2.8" transform="rotate(90)"/>
      <circle cx="0" cy="-162" r="2.8" transform="rotate(105)"/>
      <circle cx="0" cy="-162" r="2.8" transform="rotate(120)"/>
      <circle cx="0" cy="-162" r="2.8" transform="rotate(135)"/>
      <circle cx="0" cy="-162" r="2.8" transform="rotate(150)"/>
      <circle cx="0" cy="-162" r="2.8" transform="rotate(165)"/>
      <circle cx="0" cy="-162" r="2.8" transform="rotate(180)"/>
      <circle cx="0" cy="-162" r="2.8" transform="rotate(195)"/>
      <circle cx="0" cy="-162" r="2.8" transform="rotate(210)"/>
      <circle cx="0" cy="-162" r="2.8" transform="rotate(225)"/>
      <circle cx="0" cy="-162" r="2.8" transform="rotate(240)"/>
      <circle cx="0" cy="-162" r="2.8" transform="rotate(255)"/>
      <circle cx="0" cy="-162" r="2.8" transform="rotate(270)"/>
      <circle cx="0" cy="-162" r="2.8" transform="rotate(285)"/>
      <circle cx="0" cy="-162" r="2.8" transform="rotate(300)"/>
      <circle cx="0" cy="-162" r="2.8" transform="rotate(315)"/>
      <circle cx="0" cy="-162" r="2.8" transform="rotate(330)"/>
      <circle cx="0" cy="-162" r="2.8" transform="rotate(345)"/>
    </g>

    <!-- Outermost ring -->
    <circle r="178"/>
  </g>
</svg>
