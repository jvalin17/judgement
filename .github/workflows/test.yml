name: Test

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: backend (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
        shell: bash

      - name: Run pytest
        run: python -m pytest backend/tests/ -v --tb=short
        shell: bash

  frontend:
    name: frontend (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # Using 'npm install' rather than 'npm ci' because Vite's rolldown
      # pulls in optional platform-specific @emnapi/@napi-rs binary deps
      # that are recorded inconsistently across npm versions. 'npm ci' is
      # strictly lock-matched and fails on any drift; 'npm install' resolves
      # per-OS. Acceptable for a small frontend with no security-sensitive
      # transitive chain. Revisit if we need byte-for-byte reproducibility.
      - name: Install npm dependencies
        run: npm install --no-audit --no-fund
        working-directory: frontend

      # npm run lint is intentionally not gated here yet — the baseline has
      # 8 pre-existing lint errors. Add it as a gate in a follow-up PR once
      # the baseline is clean (see plans/ci_pipeline.md → Future).
      - name: Typecheck + build
        run: npm run build
        working-directory: frontend
