name: Full Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  full-suite:
    name: Full Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: judgement

      - uses: actions/checkout@v4
        with:
          repository: jvalin17/judgement-tests
          path: judgement-tests

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend deps
        run: cd judgement && pip install -r backend/requirements.txt

      - name: Install frontend deps
        run: cd judgement/frontend && npm install --no-audit --no-fund

      - name: Backend tests
        run: |
          cd judgement
          mkdir -p results && JUDGEMENT_REPO=$(pwd) python3 -m pytest ../judgement-tests/backend/ -v --rootdir=../judgement-tests --junitxml=results/backend.xml

      - name: Copy frontend tests
        run: |
          find judgement-tests/frontend/src -name "*.test.*" -type f | while read src; do
            rel="${src#judgement-tests/frontend/src/}"
            mkdir -p "judgement/frontend/src/$(dirname "$rel")"
            cp "$src" "judgement/frontend/src/$rel"
          done

      - name: Frontend tests
        run: cd judgement/frontend && npx vitest run --reporter=junit --outputFile=../results/frontend.xml

      - name: TypeScript check
        run: cd judgement/frontend && npx tsc -b

      - name: Test Summary
        uses: test-summary/action@v2
        with:
          paths: judgement/results/*.xml
        if: always()
