name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            python: '3.11'
            artifact_name: Judgement-macOS
            archive_file: Judgement-macOS.tar.gz
          - os: windows-latest
            python: '3.11'
            artifact_name: Judgement-Windows
            archive_file: Judgement-Windows.zip
          - os: ubuntu-latest
            python: '3.11'
            artifact_name: Judgement-Linux
            archive_file: Judgement-Linux.tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # --- Node.js + frontend build ---
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          cd frontend
          npm install
          npm run build

      # --- Python + PyInstaller ---
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: 'pip'

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-gi python3-gi-cairo gir1.2-gtk-3.0 \
            gir1.2-webkit2-4.1 libwebkit2gtk-4.1-dev \
            libgirepository1.0-dev pkg-config

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pywebview pyinstaller
        shell: bash

      - name: Install PyGObject (Linux)
        if: runner.os == 'Linux'
        run: pip install PyGObject

      - name: Build with PyInstaller (macOS/Linux)
        if: runner.os != 'Windows'
        run: |
          python -m PyInstaller \
            --name "Judgement" \
            --windowed \
            --onedir \
            --noconfirm \
            --clean \
            --add-data "frontend/dist:frontend/dist" \
            --add-data "backend/app/game/rounds:backend/app/game/rounds" \
            --hidden-import "backend" \
            --hidden-import "backend.app" \
            --hidden-import "backend.app.main" \
            --hidden-import "backend.app.api" \
            --hidden-import "backend.app.api.rest" \
            --hidden-import "backend.app.api.websocket" \
            --hidden-import "backend.app.api.schemas" \
            --hidden-import "backend.app.models" \
            --hidden-import "backend.app.models.card" \
            --hidden-import "backend.app.models.player" \
            --hidden-import "backend.app.models.game" \
            --hidden-import "backend.app.models.events" \
            --hidden-import "backend.app.models.session" \
            --hidden-import "backend.app.models.round_config" \
            --hidden-import "backend.app.game" \
            --hidden-import "backend.app.game.engine" \
            --hidden-import "backend.app.game.deck" \
            --hidden-import "backend.app.game.scorer" \
            --hidden-import "backend.app.game.trick_resolver" \
            --hidden-import "backend.app.game.validators" \
            --hidden-import "backend.app.game.round_manager" \
            --hidden-import "backend.app.game.round_config_loader" \
            --hidden-import "backend.app.ai" \
            --hidden-import "backend.app.ai.base" \
            --hidden-import "backend.app.ai.easy" \
            --hidden-import "backend.app.ai.medium" \
            --hidden-import "backend.app.ai.hard" \
            --hidden-import "backend.app.ai.card_play" \
            --hidden-import "backend.app.ai.hand_evaluator" \
            --hidden-import "backend.app.game_manager" \
            --hidden-import "uvicorn" \
            --hidden-import "uvicorn.logging" \
            --hidden-import "uvicorn.loops" \
            --hidden-import "uvicorn.loops.auto" \
            --hidden-import "uvicorn.protocols" \
            --hidden-import "uvicorn.protocols.http" \
            --hidden-import "uvicorn.protocols.http.auto" \
            --hidden-import "uvicorn.protocols.websockets" \
            --hidden-import "uvicorn.protocols.websockets.auto" \
            --hidden-import "uvicorn.lifespan" \
            --hidden-import "uvicorn.lifespan.on" \
            --hidden-import "websockets" \
            --hidden-import "websockets.legacy" \
            --hidden-import "websockets.legacy.server" \
            desktop/main.py

      - name: Build with PyInstaller (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m PyInstaller `
            --name "Judgement" `
            --windowed `
            --onedir `
            --noconfirm `
            --clean `
            --add-data "frontend/dist;frontend/dist" `
            --add-data "backend/app/game/rounds;backend/app/game/rounds" `
            --hidden-import "backend" `
            --hidden-import "backend.app" `
            --hidden-import "backend.app.main" `
            --hidden-import "backend.app.api" `
            --hidden-import "backend.app.api.rest" `
            --hidden-import "backend.app.api.websocket" `
            --hidden-import "backend.app.api.schemas" `
            --hidden-import "backend.app.models" `
            --hidden-import "backend.app.models.card" `
            --hidden-import "backend.app.models.player" `
            --hidden-import "backend.app.models.game" `
            --hidden-import "backend.app.models.events" `
            --hidden-import "backend.app.models.session" `
            --hidden-import "backend.app.models.round_config" `
            --hidden-import "backend.app.game" `
            --hidden-import "backend.app.game.engine" `
            --hidden-import "backend.app.game.deck" `
            --hidden-import "backend.app.game.scorer" `
            --hidden-import "backend.app.game.trick_resolver" `
            --hidden-import "backend.app.game.validators" `
            --hidden-import "backend.app.game.round_manager" `
            --hidden-import "backend.app.game.round_config_loader" `
            --hidden-import "backend.app.ai" `
            --hidden-import "backend.app.ai.base" `
            --hidden-import "backend.app.ai.easy" `
            --hidden-import "backend.app.ai.medium" `
            --hidden-import "backend.app.ai.hard" `
            --hidden-import "backend.app.ai.card_play" `
            --hidden-import "backend.app.ai.hand_evaluator" `
            --hidden-import "backend.app.game_manager" `
            --hidden-import "uvicorn" `
            --hidden-import "uvicorn.logging" `
            --hidden-import "uvicorn.loops" `
            --hidden-import "uvicorn.loops.auto" `
            --hidden-import "uvicorn.protocols" `
            --hidden-import "uvicorn.protocols.http" `
            --hidden-import "uvicorn.protocols.http.auto" `
            --hidden-import "uvicorn.protocols.websockets" `
            --hidden-import "uvicorn.protocols.websockets.auto" `
            --hidden-import "uvicorn.lifespan" `
            --hidden-import "uvicorn.lifespan.on" `
            --hidden-import "websockets" `
            --hidden-import "websockets.legacy" `
            --hidden-import "websockets.legacy.server" `
            desktop/main.py
        shell: pwsh

      - name: Archive build (macOS)
        if: runner.os == 'macOS'
        run: tar -czf Judgement-macOS.tar.gz -C dist Judgement.app

      - name: Archive build (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist\Judgement -DestinationPath Judgement-Windows.zip
        shell: pwsh

      - name: Archive build (Linux)
        if: runner.os == 'Linux'
        run: tar -czf Judgement-Linux.tar.gz -C dist Judgement

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.archive_file }}
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: List artifacts
        run: ls -lR artifacts/

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
