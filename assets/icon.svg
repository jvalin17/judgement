<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Vibrant indie-game gradient: violet -> magenta. Reads as "game",
         not "casino"; high enough chroma to pop in the dock. -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#6c47ff"/>
      <stop offset="55%"  stop-color="#a347ff"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Soft drop shadow under the card so it floats off the tile -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dx="0" dy="14" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle paper-white gradient for the card stock -->
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f1f5"/>
    </linearGradient>
  </defs>

  <!-- Tile background, macOS-rounded -->
  <rect x="0" y="0" width="1024" height="1024" rx="220" fill="url(#bg)"/>

  <!-- Single playing card, tilted ~10deg counter-clockwise for energy.
       Group-rotate so the corner pips, J, and shadow all stay in sync. -->
  <g transform="rotate(-10 512 512)" filter="url(#cardShadow)">
    <!-- Card body -->
    <rect x="244" y="180" width="536" height="664" rx="56" fill="url(#card)"/>

    <!-- Top-left mini suit + rank, like a real card index.
         Kept tiny on purpose — at 16px favicon size only the big J reads,
         which is exactly what we want. -->
    <text x="296" y="270"
          font-family="'Space Grotesk', 'Inter', system-ui, sans-serif"
          font-size="78" font-weight="700"
          fill="#ec4899">J</text>
    <path transform="translate(296 320) scale(0.18)"
          fill="#ec4899" d="
            M 0 -260 C -180 -100, -280 10, -280 130
            C -280 210, -210 250, -150 250
            C -100 250, -55 225, -30 180
            C -50 250, -80 305, -110 340 L 110 340
            C  80 305,  50 250,  30 180
            C  55 225, 100 250, 150 250
            C 210 250, 280 210, 280 130
            C 280  10, 180 -100, 0 -260 Z"/>

    <!-- Bottom-right mini index (rotated 180), mirroring the top -->
    <g transform="rotate(180 512 512)">
      <text x="296" y="270"
            font-family="'Space Grotesk', 'Inter', system-ui, sans-serif"
            font-size="78" font-weight="700"
            fill="#ec4899">J</text>
      <path transform="translate(296 320) scale(0.18)"
            fill="#ec4899" d="
              M 0 -260 C -180 -100, -280 10, -280 130
              C -280 210, -210 250, -150 250
              C -100 250, -55 225, -30 180
              C -50 250, -80 305, -110 340 L 110 340
              C  80 305,  50 250,  30 180
              C  55 225, 100 250, 150 250
              C 210 250, 280 210, 280 130
              C 280  10, 180 -100, 0 -260 Z"/>
    </g>

    <!-- The hero: huge bold "J" at the center.
         Geometric sans-serif weight, vivid magenta to match the bg highlight. -->
    <text x="512" y="640"
          text-anchor="middle"
          font-family="'Space Grotesk', 'Inter', 'Helvetica Neue', sans-serif"
          font-size="460" font-weight="800"
          fill="#6c47ff"
          letter-spacing="-12">J</text>
  </g>
</svg>
