# Deployed on the Oracle VM. Run from the repo root with:
#   docker compose -f deployment/docker-compose.yml up -d --build
#
# Phase D: container binds to 127.0.0.1:8000 only. Caddy (running on the host,
# not in this compose) listens on :80 and :443, terminates TLS, and reverse-
# proxies to this loopback port. The container is no longer publicly exposed.

services:
  judgement:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    image: judgement:latest
    container_name: judgement
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ml-data:/app/backend/app/ml/learning/data
    environment:
      - JUDGEMENT_SERVER_MODE=1
      - JUDGEMENT_GITHUB_TOKEN=${JUDGEMENT_GITHUB_TOKEN:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  ml-data:
